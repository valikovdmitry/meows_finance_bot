services:
  bot:
    image: ${BOT_IMAGE:-ghcr.io/valikovdmitry/meows_finace_bot:dev}
    container_name: meows-finance-bot-dev
    restart: unless-stopped
    init: true
    mem_limit: 512m
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/meows-finance-bot-ready"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
